<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Volviendo a Financia…</title>
<style>:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 system-ui,sans-serif;background:Canvas;color:CanvasText;text-align:center}main{padding:24px;max-width:420px}a{color:#2f7a5f}</style>
</head>
<body>
<main>
  <h1>Volviendo a Financia…</h1>
  <p id="message">Si no ocurre nada en unos segundos, <a id="manual" href="#">pulsa aquí</a>.</p>
</main>
<script>
  // Bank authorisation returns here (Enable Banking requires a public HTTPS redirect URL).
  // The code is forwarded to the app on this device; this page stores and logs nothing.
  // Only fixed destinations are allowed, chosen by the "target" saved in the OAuth state.
  (function () {
    var destinations = {
      local: "http://localhost:5173/bank/callback"
    };
    var params = new URLSearchParams(location.search);
    var target = "local";
    try {
      var state = params.get("state") || "";
      var prefix = state.split(".")[0];
      if (destinations[prefix]) target = prefix;
    } catch (error) {}
    var url = destinations[target] + location.search;
    document.getElementById("manual").href = url;
    location.replace(url);
  })();
</script>
</body>
</html>
